server.port=${SERVER_PORT:9090}
spring.profiles.default=final
server.address=${SERVER_ADDRESS:127.0.0.1}
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

# Database
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3307/media_db?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf-8&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=3000
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.slf4j.Slf4jImpl
spring.mvc.async.request-timeout=${AI_INTERACTIVE_TIMEOUT_MS:180000}
spring.sql.init.mode=never
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Document workspace (internal adapter in services/docling, not the docling-serve API)
document.docling.url=${DOCLING_URL:http://127.0.0.1:5001}
document.docling.timeout-seconds=${DOCLING_TIMEOUT_SECONDS:1200}
document.max-file-bytes=${DOCUMENT_MAX_FILE_BYTES:209715200}
document.max-blocks=${DOCUMENT_MAX_BLOCKS:2000}
document.block-timeout-ms=${DOCUMENT_BLOCK_TIMEOUT_MS:600000}
rocketmq.topic.document-analysis=${ROCKETMQ_DOCUMENT_TOPIC:document-analysis-topic}
rocketmq.consumer.document-group=${ROCKETMQ_DOCUMENT_GROUP:document-analysis-group}
spring.flyway.baseline-on-migrate=${FLYWAY_BASELINE_ON_MIGRATE:true}
spring.flyway.baseline-version=0

# Upload
spring.servlet.multipart.max-file-size=2048MB
spring.servlet.multipart.max-request-size=2048MB

# Model gateway
ai.deepseek.api-key=${SILICONFLOW_API_KEY}
ai.deepseek.base-url=${SILICONFLOW_BASE_URL:https://api.siliconflow.cn/v1}
ai.deepseek.model=${LLM_MODEL:deepseek-ai/DeepSeek-V3.2}
ai.deepseek.timeout-seconds=${LLM_TIMEOUT_SECONDS:300}
ai.deepseek.input-price-per-million=${LLM_INPUT_PRICE_PER_MILLION:0}
ai.deepseek.output-price-per-million=${LLM_OUTPUT_PRICE_PER_MILLION:0}
ai.embedding.model=${EMBEDDING_MODEL:BAAI/bge-m3}
ai.asr.url=${ASR_URL:https://api.siliconflow.cn/v1/audio/transcriptions}
ai.asr.model=${ASR_MODEL:TeleAI/TeleSpeechASR}

# Agent termination budget
agent.budget.max-rounds=${AGENT_MAX_ROUNDS:2}
agent.budget.max-duration-ms=${AGENT_MAX_DURATION_MS:120000}
agent.budget.max-estimated-tokens=${AGENT_MAX_ESTIMATED_TOKENS:50000}
# 0 means disabled. When enabled, configure both provider prices above.
agent.budget.max-estimated-cost=${AGENT_MAX_ESTIMATED_COST:0}
agent.evaluation.enabled=${AGENT_EVALUATION_ENABLED:false}
agent.evaluation.dataset=${AGENT_EVALUATION_DATASET:../evaluation/golden-video-tasks.json}

# Vector store
vector.qdrant.enabled=${QDRANT_ENABLED:true}
vector.qdrant.url=${QDRANT_URL:http://localhost:6333}
vector.qdrant.api-key=${QDRANT_API_KEY:}
vector.qdrant.collection=${QDRANT_COLLECTION:video_chunks}

# Redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.database=${REDIS_DATABASE:0}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=3000ms

# MinIO
minio.endpoint=${MINIO_ENDPOINT:http://localhost:9000}
minio.accessKey=${MINIO_ACCESS_KEY}
minio.secretKey=${MINIO_SECRET_KEY}
minio.bucketName=${MINIO_BUCKET:media}
minio.public-read=${MINIO_PUBLIC_READ:false}

# Local media tools
tool.ytdlp.path=${YTDLP_PATH:yt-dlp}
# 部分站点（如 B 站）需要登录态 cookie 才能下载，否则返回 HTTP 412。
# 二者互斥，YTDLP_COOKIES（Netscape 格式文件）优先，更适合服务端无人值守场景。
tool.ytdlp.cookies=${YTDLP_COOKIES:}
tool.ytdlp.cookies-from-browser=${YTDLP_COOKIES_FROM_BROWSER:}
tool.ffmpeg.dir=${FFMPEG_DIR:}
tool.ocr.command=${OCR_COMMAND:tesseract}

# RocketMQ
rocketmq.name-server=${ROCKETMQ_NAME_SERVER:127.0.0.1:9876}
rocketmq.producer.group=${ROCKETMQ_PRODUCER_GROUP:video-analysis-producer}
rocketmq.producer.send-message-timeout=3000
rocketmq.topic.video-analysis=${ROCKETMQ_ANALYSIS_TOPIC:video-analysis-topic}
rocketmq.topic.video-analysis-dead=${ROCKETMQ_ANALYSIS_DEAD_TOPIC:video-analysis-dead-topic}
rocketmq.consumer.group=${ROCKETMQ_ANALYSIS_GROUP:video-analysis-consumer}

# Independent document pipeline stages
document.upload-ttl-seconds=${DOCUMENT_UPLOAD_TTL_SECONDS:86400}
document.upload-cleanup-interval-ms=${DOCUMENT_UPLOAD_CLEANUP_INTERVAL_MS:600000}
document.parser-workers=${DOCUMENT_PARSER_WORKERS:1}
document.dispatch-workers=${DOCUMENT_DISPATCH_WORKERS:4}

document.chat-workers=${DOCUMENT_CHAT_WORKERS:2}

# Native text-layer PDF parsing; DOCLING preserves richer layout.
document.pdf-parser=${DOCUMENT_PDF_PARSER:FAST}
document.retrieval.routing-enabled=${DOCUMENT_RETRIEVAL_ROUTING_ENABLED:false}
document.retrieval.routing.enabled=${DOCUMENT_RETRIEVAL_ROUTING_ENABLED:false}
document.retrieval.routing.mode=${DOCUMENT_RETRIEVAL_RUN_MODE:ROUTED}
document.retrieval.routing.fallback.on-empty=${DOCUMENT_RETRIEVAL_FALLBACK_ON_EMPTY:true}
document.retrieval.routing.fallback.on-low-confidence=${DOCUMENT_RETRIEVAL_FALLBACK_ON_LOW_CONFIDENCE:true}
document.retrieval.routing.fallback.bm25-min-coverage=${DOCUMENT_RETRIEVAL_BM25_MIN_COVERAGE:0.55}
document.retrieval.routing.fallback.dense-min-score=${DOCUMENT_RETRIEVAL_DENSE_MIN_SCORE:0.45}
document.retrieval.routing.fallback.quality-top-k=${DOCUMENT_RETRIEVAL_QUALITY_TOP_K:5}
document.retrieval.routing.shadow.url=${DOCUMENT_RETRIEVAL_SHADOW_URL:}
document.retrieval.routing.shadow.sample-rate=${DOCUMENT_RETRIEVAL_SHADOW_SAMPLE_RATE:0.01}
document.docx-parser=${DOCUMENT_DOCX_PARSER:DOCLING}
document.docling-document-ids=${DOCUMENT_DOCLING_DOCUMENT_IDS:}
document.fast-parser-workers=${DOCUMENT_FAST_PARSER_WORKERS:4}

# Adaptive document strategies. Thresholds use the declared conservative counting mode.
document.adaptive.short-tokens=${DOCUMENT_SHORT_TOKENS:8000}
document.adaptive.medium-tokens=${DOCUMENT_MEDIUM_TOKENS:20000}
document.adaptive.large-tokens=${DOCUMENT_LARGE_TOKENS:50000}
document.adaptive.context-tokens=${DOCUMENT_CONTEXT_TOKENS:32768}
document.adaptive.output-tokens=${DOCUMENT_OUTPUT_TOKENS:2048}
document.adaptive.safety-tokens=${DOCUMENT_SAFETY_TOKENS:1024}
document.adaptive.fact-tokens=${DOCUMENT_FACT_TOKENS:2000}
document.adaptive.local-tokens=${DOCUMENT_LOCAL_TOKENS:4500}
document.adaptive.comparison-tokens=${DOCUMENT_COMPARISON_TOKENS:8000}
document.adaptive.map-tokens=${DOCUMENT_MAP_TOKENS:12000}
document.adaptive.dense-top-k=${DOCUMENT_DENSE_TOP_K:30}
document.adaptive.sparse-top-k=${DOCUMENT_SPARSE_TOP_K:30}
document.adaptive.fusion-top-k=${DOCUMENT_FUSION_TOP_K:28}
document.llm.reasoning-effort=${DOCUMENT_LLM_REASONING_EFFORT:none}
document.adaptive.final-top-k=${DOCUMENT_FINAL_TOP_K:12}
document.adaptive.rrf-k=${DOCUMENT_RRF_K:60}
document.adaptive.max-documents=${DOCUMENT_MAX_QUERY_DOCUMENTS:64}
document.adaptive.max-global-calls=${DOCUMENT_MAX_GLOBAL_CALLS:64}
document.adaptive.index-batch-size=${DOCUMENT_INDEX_BATCH_SIZE:32}
document.adaptive.retrieval-url=${DOCUMENT_RETRIEVAL_URL:}
document.adaptive.retrieval-key=${DOCUMENT_RETRIEVAL_KEY:}
document.adaptive.index-version=${DOCUMENT_INDEX_VERSION:hybrid-v3-section-bge-small-zh-350}
document.chunk.target-tokens=${DOCUMENT_CHUNK_TARGET_TOKENS:350}
document.chunk.hierarchy-enabled=${DOCUMENT_HIERARCHY_ENABLED:false}
document.chunk.parent-target-tokens=${DOCUMENT_PARENT_TARGET_TOKENS:1000}
document.chunk.parent-max-tokens=${DOCUMENT_PARENT_MAX_TOKENS:1500}
document.chunk.parent-context-enabled=${DOCUMENT_PARENT_CONTEXT_ENABLED:false}
document.chunk.parent-context-max-bytes=${DOCUMENT_PARENT_CONTEXT_MAX_BYTES:6000}
document.chunk.parent-context-total-bytes=${DOCUMENT_PARENT_CONTEXT_TOTAL_BYTES:12000}
document.chunk.max-tokens=${DOCUMENT_CHUNK_MAX_TOKENS:480}
document.chunk.min-preferred-tokens=${DOCUMENT_CHUNK_MIN_PREFERRED_TOKENS:80}
document.chunk.merge-peers=${DOCUMENT_CHUNK_MERGE_PEERS:true}


# Conservative UTF-8 byte bound for clean, retrieved evidence (not full-document loading).
document.adaptive.max-evidence-bytes=${DOCUMENT_MAX_EVIDENCE_BYTES:20000}

document.chunk.strategy=${DOCUMENT_CHUNK_STRATEGY:legacy}
document.query-rewrite.enabled=${DOCUMENT_QUERY_REWRITE_ENABLED:false}
