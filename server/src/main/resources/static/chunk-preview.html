<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>分块策略对比</title>
<style>body{max-width:1400px;margin:32px auto;font:16px system-ui;padding:16px;background:#f7f9fc;color:#172b42}input,select,button{padding:8px;margin:5px}main{display:grid;grid-template-columns:1fr 1fr;gap:20px}article{background:white;border:1px solid #dae2ed;padding:16px;margin:12px 0;white-space:pre-wrap;overflow-wrap:anywhere}small{color:#526780}label{display:inline-block}button{cursor:pointer}</style>
<h1>分块策略对比</h1><p>对同一份已保存的解析批次，比较原策略与句段边界策略。不写入索引，不调用聊天模型。</p>
<form id="login"><input id="username" placeholder="账号" required><input id="password" type="password" placeholder="密码" required><button>登录并加载文档</button></form>
<select id="documents"></select><label>解析批次（从 0 开始）<input id="batch" type="number" value="0" min="0"></label>
<label>目标 Token<input id="target" type="number" value="350" min="32" max="480"></label><label>上限 Token<input id="maximum" type="number" value="480" min="32" max="480"></label>
<label>短块阈值<input id="minimum" type="number" value="80" min="1" max="480"></label><label><input id="merge" type="checkbox" checked>合并同标题短块</label><button id="compare" disabled>对比预览</button><p id="status"></p>
<main><section><h2>原策略</h2><div id="legacy"></div></section><section><h2>句段边界策略（实验）</h2><div id="boundary"></div></section></main>
<script>
let token='';const el=id=>document.getElementById(id);
async function api(path,body){const res=await fetch(path,{method:body?'POST':'GET',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:body?JSON.stringify(body):undefined});const data=await res.json();if(!res.ok||data.code!==0)throw Error(data.message||res.status);return data.data;}
el('login').onsubmit=async e=>{e.preventDefault();try{token=(await api('/user/login',{username:el('username').value,password:el('password').value})).token;el('password').value='';el('documents').replaceChildren();for(const d of await api('/documents')){const option=document.createElement('option');option.value=d.id;option.textContent=d.filename;el('documents').append(option);}el('compare').disabled=false;el('status').textContent='已加载文档。';}catch(e){el('status').textContent=e.message;}};
el('compare').onclick=async()=>{el('compare').disabled=true;el('status').textContent='正在对比…';el('legacy').replaceChildren();el('boundary').replaceChildren();const id=el('documents').value;const config={batchIndex:+el('batch').value,targetTokens:+el('target').value,maxTokens:+el('maximum').value,minPreferredTokens:+el('minimum').value,mergePeers:el('merge').checked};try{for(const strategy of ['legacy','boundary']){const data=await api('/documents/'+encodeURIComponent(id)+'/chunk-preview',{...config,strategy});const info=document.createElement('p');info.textContent=data.count+' 块';el(strategy).append(info);for(const c of data.chunks){const card=document.createElement('article'),meta=document.createElement('small'),text=document.createElement('p');meta.textContent=`块 ${c.order} · ${c.token_count} Token · 页 ${c.page_start??'?'}–${c.page_end??'?'} · ${c.title_path}`;text.textContent=c.content;card.append(meta,text);el(strategy).append(card);}}el('status').textContent='对比完成。此操作没有改变当前文档索引。';}catch(e){el('status').textContent=e.message;}finally{el('compare').disabled=false;}};
</script></html>
